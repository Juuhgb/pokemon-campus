services:
  postgres:
    image: postgres:17-alpine
    container_name: pokemon-campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokemon_campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pokemon-campus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d pokemon_campus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pokemon-campus-postgres:
