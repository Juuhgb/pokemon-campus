<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Equipe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff6e5}
a{color:#1d1b3a}a:hover{color:#ff5a4e}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #fff6e5; font-family: 'Nunito', system-ui, sans-serif; color: #1d1b3a; display: flex; flex-direction: column">
  <header style="padding: 22px 20px 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div>
      <h1 style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 34px; font-weight: 700; line-height: 1">Minha equipe</h1>
      <p style="margin: 6px 0 0; font-size: 14px; font-weight: 700; color: #5b587a">Até 3 Pokémon para batalhar</p>
    </div>
    <sc-if value="{{synced}}" hint-placeholder-val="{{ true }}">
      <span role="status" style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 12px; background: #7ad88f; border: 2.5px solid #1d1b3a; font-size: 12px; font-weight: 800">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1d1b3a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        Salva
      </span>
    </sc-if>
    <sc-if value="{{pending}}" hint-placeholder-val="{{ false }}">
      <span role="status" style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 12px; background: #ffc23d; border: 2.5px solid #1d1b3a; font-size: 12px; font-weight: 800">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
        Aguardando envio
      </span>
    </sc-if>
  </header>

  <section aria-label="Equipe atual" style="padding: 14px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{slots}}" as="slot" hint-placeholder-count="3">
      <sc-if value="{{slot.filled}}" hint-placeholder-val="{{ true }}">
        <article style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 20px; background: #ffffff; border: 2.5px solid #1d1b3a; box-shadow: 4px 4px 0 #1d1b3a; text-align: center">
          <span style="position: absolute; left: -8px; top: -8px; width: 26px; height: 26px; border-radius: 999px; background: #ff5a4e; border: 2.5px solid #1d1b3a; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 14px; font-weight: 700; box-sizing: border-box">{{slot.position}}</span>
          <dc-import name="Creature" kind="{{slot.kind}}" color="{{slot.color}}" size="58" hint-size="58px,58px"></dc-import>
          <h2 style="margin: 4px 0 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 16px; font-weight: 600; line-height: 1.1">{{slot.name}}</h2>
          <span style="font-size: 12px; font-weight: 800; color: #5b587a">Nv. {{slot.level}}</span>
          <div style="width: 100%; height: 10px; border-radius: 999px; background: #ece9f5; border: 2px solid #1d1b3a; overflow: hidden; box-sizing: border-box">
            <div style="width: {{slot.hpPercent}}%; height: 100%; background: {{slot.hpColor}}"></div>
          </div>
          <span style="font-size: 11px; font-weight: 800; color: #5b587a">PV {{slot.hp}}/{{slot.maxHp}}</span>
          <button type="button" onClick="{{slot.remove}}" aria-label="Tirar {{slot.name}} da equipe" style="min-height: 44px; width: 100%; border-radius: 12px; border: 2px solid #1d1b3a; background: #fff6e5; font-family: inherit; font-size: 12px; font-weight: 800; color: #1d1b3a; cursor: pointer">Tirar</button>
        </article>
      </sc-if>
      <sc-if value="{{slot.empty}}" hint-placeholder-val="{{ false }}">
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 236px; padding: 12px 6px; box-sizing: border-box; border-radius: 20px; border: 2.5px dashed #1d1b3a; background: #f7f1e3; text-align: center">
          <span style="position: absolute; left: -8px; top: -8px; width: 26px; height: 26px; border-radius: 999px; background: #ffffff; border: 2.5px solid #1d1b3a; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 14px; font-weight: 700; box-sizing: border-box">{{slot.position}}</span>
          <span style="width: 54px; height: 54px; border-radius: 999px; border: 2.5px dashed #1d1b3a; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </span>
          <span style="font-size: 13px; font-weight: 800; color: #5b587a">Vaga livre</span>
        </div>
      </sc-if>
    </sc-for>
  </section>

  <section aria-labelledby="available-title" style="flex: 1; min-height: 0; padding: 22px 20px 100px; display: flex; flex-direction: column; gap: 10px">
    <h2 id="available-title" style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 21px; font-weight: 600">Do seu álbum</h2>
    <sc-for list="{{available}}" as="c" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 10px; border-radius: 18px; background: #ffffff; border: 2.5px solid #1d1b3a">
        <dc-import name="Creature" kind="{{c.kind}}" color="{{c.color}}" size="40" hint-size="40px,40px"></dc-import>
        <span style="flex: 1; min-width: 0; font-weight: 800; font-size: 15px">{{c.name}} <span style="font-weight: 700; color: #5b587a">Nv. {{c.level}}</span></span>
        <button type="button" onClick="{{c.add}}" disabled="{{c.full}}" style="height: 44px; padding: 0 14px; border-radius: 14px; border: 2.5px solid #1d1b3a; font-family: inherit; font-size: 14px; font-weight: 800; color: #1d1b3a; cursor: pointer; background: {{c.addBg}}; box-shadow: {{c.addShadow}}">Adicionar</button>
      </div>
    </sc-for>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="Nav" active="team" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { team: ['faiscao', 'brasinha'], dirty: false };

  renderVals() {
    const owned = [
      { id: 'faiscao', name: 'Faiscão', kind: 'bolt', color: '#ffc23d', level: 12, hp: 42, maxHp: 48 },
      { id: 'brasinha', name: 'Brasinha', kind: 'flame', color: '#ff8a5c', level: 15, hp: 51, maxHp: 51 },
      { id: 'brotinho', name: 'Brotinho', kind: 'leaf', color: '#7ad88f', level: 6, hp: 18, maxHp: 24 },
      { id: 'gotinha', name: 'Gotinha', kind: 'drop', color: '#6aa8ff', level: 5, hp: 22, maxHp: 22 },
      { id: 'corujito', name: 'Corujito', kind: 'wing', color: '#c9b8ff', level: 9, hp: 30, maxHp: 34 },
      { id: 'pedregulho', name: 'Pedregulho', kind: 'rock', color: '#d9c3a0', level: 7, hp: 28, maxHp: 28 },
    ];
    const team = this.state.team;
    const full = team.length >= 3;
    const update = (next) => this.setState({ team: next, dirty: true });

    const slots = [0, 1, 2].map((index) => {
      const creature = owned.find((c) => c.id === team[index]);
      if (!creature) return { position: index + 1, filled: false, empty: true };
      const percent = Math.round((creature.hp / creature.maxHp) * 100);
      return {
        ...creature,
        position: index + 1,
        filled: true,
        empty: false,
        hpPercent: percent,
        hpColor: percent > 50 ? '#2fb36b' : percent > 25 ? '#ffc23d' : '#ff5a4e',
        remove: () => update(team.filter((id) => id !== creature.id)),
      };
    });

    const available = owned
      .filter((c) => !team.includes(c.id))
      .slice(0, 4)
      .map((c) => ({
        ...c,
        full,
        addBg: full ? '#ece9f5' : '#ffc23d',
        addShadow: full ? 'none' : '3px 3px 0 #1d1b3a',
        add: () => { if (!full) update([...team, c.id]); },
      }));

    return { slots, available, synced: !this.state.dirty, pending: this.state.dirty };
  }
}
</script>
</body>
</html>
