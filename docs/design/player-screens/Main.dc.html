<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mapa de exploração</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff6e5}
a{color:#1d1b3a}a:hover{color:#ff5a4e}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #dff0c8; font-family: 'Nunito', system-ui, sans-serif; color: #1d1b3a">

  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0">
    <rect width="390" height="844" fill="#dff0c8"></rect>
    <rect x="200" y="380" width="170" height="120" rx="18" fill="#f6ecd4"></rect>
    <rect x="20" y="360" width="120" height="90" rx="18" fill="#f6ecd4"></rect>
    <path d="M-20 120 L140 210 L420 160" stroke="#1d1b3a" stroke-width="26" fill="none" stroke-linecap="round"></path>
    <path d="M-20 120 L140 210 L420 160" stroke="#ffffff" stroke-width="20" fill="none" stroke-linecap="round"></path>
    <path d="M60 -20 C 90 200, 40 420, 120 620 S 160 820, 140 880" stroke="#1d1b3a" stroke-width="20" fill="none" stroke-linecap="round"></path>
    <path d="M60 -20 C 90 200, 40 420, 120 620 S 160 820, 140 880" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round"></path>
    <path d="M-20 560 L200 470 L420 520" stroke="#1d1b3a" stroke-width="18" fill="none" stroke-linecap="round"></path>
    <path d="M-20 560 L200 470 L420 520" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round"></path>
    <polygon points="150,250 280,232 300,330 170,350" fill="rgba(106,168,255,0.35)" stroke="#1d1b3a" stroke-width="2.5"></polygon>
    <polygon points="20,190 110,180 120,280 30,300" fill="rgba(122,216,143,0.45)" stroke="#1d1b3a" stroke-width="2.5"></polygon>
    <polygon points="250,480 370,470 380,600 270,620" fill="rgba(255,194,61,0.4)" stroke="#1d1b3a" stroke-width="2.5"></polygon>
    <polygon points="10,600 120,590 130,700 20,720" fill="rgba(201,184,255,0.5)" stroke="#1d1b3a" stroke-width="2.5"></polygon>
    <circle cx="70" cy="420" r="9" fill="#9fd477" stroke="#1d1b3a" stroke-width="2"></circle>
    <circle cx="96" cy="404" r="7" fill="#9fd477" stroke="#1d1b3a" stroke-width="2"></circle>
    <circle cx="330" cy="420" r="9" fill="#9fd477" stroke="#1d1b3a" stroke-width="2"></circle>
  </svg>

  <div style="position: absolute; left: 135px; top: 240px; width: 120px; height: 120px; border-radius: 999px; border: 2.5px dashed #1d1b3a; background: rgba(255,194,61,0.22); box-sizing: border-box"></div>
  <div style="position: absolute; left: 182px; top: 284px; width: 26px; height: 26px; border-radius: 999px; background: #ff5a4e; border: 3px solid #1d1b3a; box-sizing: border-box; box-shadow: 2px 2px 0 #1d1b3a"></div>

  <div style="position: absolute; left: 214px; top: 236px">
    <dc-import name="Creature" kind="bolt" color="#ffc23d" size="46" hint-size="46px,46px"></dc-import>
  </div>
  <div style="position: absolute; left: 50px; top: 214px">
    <dc-import name="Creature" kind="drop" color="#6aa8ff" size="40" hint-size="40px,40px"></dc-import>
  </div>
  <div style="position: absolute; left: 300px; top: 520px">
    <dc-import name="Creature" kind="flame" color="#ff8a5c" size="40" hint-size="40px,40px"></dc-import>
  </div>
  <div style="position: absolute; left: 60px; top: 630px">
    <dc-import name="Creature" kind="leaf" color="#7ad88f" size="40" hint-size="40px,40px"></dc-import>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 18px; background: #ffffff; border: 2.5px solid #1d1b3a; box-shadow: 4px 4px 0 #1d1b3a; min-width: 0">
      <span aria-hidden="true" style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 12px; background: #6aa8ff; border: 2.5px solid #1d1b3a; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d1b3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l8-6 8 6v10H4z"></path><path d="M10 20v-5h4v5"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 12px; font-weight: 800; color: #5b587a">Você está em</span>
        <span style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 17px; font-weight: 600; line-height: 1.15">Ciência da Computação</span>
      </div>
    </div>
    <span style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: #ffffff; border: 2.5px solid #1d1b3a; font-size: 13px; font-weight: 800">
      <span style="width: 10px; height: 10px; border-radius: 999px; background: #2fb36b; border: 2px solid #1d1b3a; box-sizing: border-box"></span>
      Online
    </span>
  </div>

  <button type="button" aria-label="Centralizar no jogador" style="position: absolute; right: 16px; bottom: 300px; width: 52px; height: 52px; border-radius: 16px; border: 2.5px solid #1d1b3a; background: #ffffff; color: #1d1b3a; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 #1d1b3a; cursor: pointer">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
  </button>

  <section aria-labelledby="near-title" style="position: absolute; left: 0; right: 0; bottom: 92px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
      <h2 id="near-title" style="margin: 0; padding: 4px 12px; border-radius: 12px; background: #ffffff; border: 2.5px solid #1d1b3a; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 17px; font-weight: 600">Por perto · 3</h2>
    </div>
    <div style="display: flex; gap: 12px; overflow-x: auto; padding: 4px 16px 10px">
      <sc-for list="{{nearby}}" as="n" hint-placeholder-count="3">
        <a href="{{n.href}}" style="flex: 0 0 150px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 20px; text-decoration: none; color: #1d1b3a; background: {{n.bg}}; border: 2.5px solid #1d1b3a; box-shadow: 4px 4px 0 #1d1b3a">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <dc-import name="Creature" kind="{{n.kind}}" color="{{n.color}}" size="44" hint-size="44px,44px"></dc-import>
            <span aria-label="Direção {{n.direction}}" style="width: 32px; height: 32px; border-radius: 999px; background: #ffffff; border: 2px solid #1d1b3a; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{n.angle}}deg)"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
            </span>
          </div>
          <div>
            <div style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 17px; font-weight: 600; line-height: 1.1">{{n.name}}</div>
            <div style="font-size: 12px; font-weight: 700; color: #5b587a">Nv. {{n.level}} · {{n.rarity}}</div>
          </div>
          <div style="display: flex; align-items: baseline; justify-content: space-between">
            <span style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 22px; font-weight: 700">{{n.distance}}</span>
            <sc-if value="{{n.inRange}}" hint-placeholder-val="{{ false }}">
              <span style="padding: 2px 8px; border-radius: 999px; background: #1d1b3a; font-size: 11px; font-weight: 800; color: #ffc23d">No alcance</span>
            </sc-if>
          </div>
        </a>
      </sc-for>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="Nav" active="map" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const nearby = [
      { name: 'Faiscão', kind: 'bolt', color: '#ffc23d', level: 12, rarity: 'Incomum', distance: '18 m', angle: 40, direction: 'nordeste', inRange: true, href: 'Encounter.dc.html' },
      { name: 'Gotinha', kind: 'drop', color: '#6aa8ff', level: 5, rarity: 'Comum', distance: '96 m', angle: 300, direction: 'noroeste', inRange: false, href: 'Encounter.dc.html' },
      { name: 'Brasinha', kind: 'flame', color: '#ff8a5c', level: 15, rarity: 'Raro', distance: '182 m', angle: 150, direction: 'sudeste', inRange: false, href: 'Encounter.dc.html' },
    ].map((n) => ({ ...n, bg: n.inRange ? '#ffc23d' : '#ffffff' }));
    return { nearby };
  }
}
</script>
</body>
</html>
