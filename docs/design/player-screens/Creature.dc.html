<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criatura</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; border-radius: 999px; width: {{size}}px; height: {{size}}px; background: {{color}}; border: {{ring}}px solid #1d1b3a; box-shadow: {{shadow}}px {{shadow}}px 0 #1d1b3a; color: {{ink}}">
  <svg width="{{glyph}}" height="{{glyph}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <sc-if value="{{isLeaf}}" hint-placeholder-val="{{ true }}"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"></path><path d="M5 19l7-7"></path></sc-if>
    <sc-if value="{{isBolt}}" hint-placeholder-val="{{ false }}"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"></path></sc-if>
    <sc-if value="{{isDrop}}" hint-placeholder-val="{{ false }}"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"></path></sc-if>
    <sc-if value="{{isFlame}}" hint-placeholder-val="{{ false }}"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"></path></sc-if>
    <sc-if value="{{isRock}}" hint-placeholder-val="{{ false }}"><path d="M4 16l3-8 5-3 6 4 2 7-6 3H8z"></path><path d="M12 5l-1 7 7 4"></path></sc-if>
    <sc-if value="{{isWing}}" hint-placeholder-val="{{ false }}"><path d="M3 12c4-6 14-6 18 0-4 6-14 6-18 0z"></path><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle></sc-if>
    <sc-if value="{{isStar}}" hint-placeholder-val="{{ false }}"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></sc-if>
    <sc-if value="{{isUnknown}}" hint-placeholder-val="{{ false }}"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"></path><path d="M12 17.5v.01"></path></sc-if>
  </svg>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["leaf","bolt","drop","flame","rock","wing","star","unknown"],"default":"leaf"},"color":{"editor":"color","options":["#7ad88f","#ffc23d","#6aa8ff","#ff8a5c","#c9b8ff","#e6e3f0"],"default":"#7ad88f"},"size":{"editor":"int","min":24,"max":160,"default":72},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'leaf';
    const size = Number(this.props.size ?? 72);
    return {
      size,
      color: this.props.color ?? '#7ad88f',
      ink: kind === 'unknown' ? '#5b587a' : '#1d1b3a',
      ring: size >= 64 ? 3 : 2.5,
      shadow: size >= 64 ? 4 : size >= 40 ? 3 : 2,
      glyph: Math.round(size * 0.5),
      isLeaf: kind === 'leaf',
      isBolt: kind === 'bolt',
      isDrop: kind === 'drop',
      isFlame: kind === 'flame',
      isRock: kind === 'rock',
      isWing: kind === 'wing',
      isStar: kind === 'star',
      isUnknown: kind === 'unknown',
    };
  }
}
</script>
</body>
</html>
