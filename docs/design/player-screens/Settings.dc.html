<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff6e5}
a{color:#1d1b3a}a:hover{color:#ff5a4e}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #fff6e5; font-family: 'Nunito', system-ui, sans-serif; color: #1d1b3a; display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 24px; box-sizing: border-box">

  <header style="display: flex; align-items: center; gap: 12px">
    <a href="Profile.dc.html" aria-label="Voltar ao perfil" style="width: 46px; height: 46px; flex-shrink: 0; box-sizing: border-box; border-radius: 14px; border: 2.5px solid #1d1b3a; background: #ffffff; box-shadow: 3px 3px 0 #1d1b3a; color: #1d1b3a; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">Configurações</h1>
  </header>

  <section aria-labelledby="google-title" style="padding: 14px 16px; border-radius: 22px; background: #ffffff; border: 2.5px solid #1d1b3a; display: flex; flex-direction: column; gap: 10px">
    <h2 id="google-title" style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 19px; font-weight: 600">Conta Google</h2>
    <sc-if value="{{linked}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 12px">
        <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; box-sizing: border-box; border-radius: 999px; border: 2.5px solid #1d1b3a; background: #fff6e5; display: flex; align-items: center; justify-content: center; font-weight: 800">G</span>
        <div style="flex: 1; min-width: 0">
          <div style="font-weight: 800; font-size: 15px">Vinculada</div>
          <div style="font-size: 13px; font-weight: 700; color: #5b587a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">ana.lima@exemplo.com</div>
        </div>
        <span style="padding: 3px 10px; border-radius: 999px; background: #7ad88f; border: 2px solid #1d1b3a; font-size: 12px; font-weight: 800">Ativa</span>
      </div>
      <button type="button" onClick="{{unlink}}" style="height: 44px; border-radius: 14px; border: 2.5px solid #1d1b3a; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 800; color: #b42318; cursor: pointer">Desvincular conta Google</button>
    </sc-if>
    <sc-if value="{{unlinked}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.45; color: #5b587a">Vincule para não perder seu progresso se trocar de celular.</p>
      <button type="button" onClick="{{link}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 16px; border: 2.5px solid #1d1b3a; background: #ffffff; box-shadow: 4px 4px 0 #1d1b3a; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 17px; font-weight: 600; color: #1d1b3a; cursor: pointer">
        <span aria-hidden="true" style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 999px; border: 2.5px solid #1d1b3a; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">G</span>
        Vincular conta Google
      </button>
    </sc-if>
  </section>

  <section aria-labelledby="name-title" style="padding: 14px 16px; border-radius: 22px; background: #ffffff; border: 2.5px solid #1d1b3a; display: flex; flex-direction: column; gap: 8px">
    <label id="name-title" for="display-name" style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 19px; font-weight: 600">Nome no jogo</label>
    <input id="display-name" type="text" value="{{name}}" onChange="{{changeName}}" style="height: 48px; padding: 0 14px; box-sizing: border-box; border-radius: 14px; border: 2.5px solid {{nameBorder}}; background: #fff6e5; font-family: inherit; font-size: 16px; font-weight: 800; color: #1d1b3a; outline: none">
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: {{nameHintColor}}">
      <span>{{nameHint}}</span>
      <span>{{nameCount}}/40</span>
    </div>
  </section>

  <section aria-labelledby="course-title" style="padding: 14px 16px; border-radius: 22px; background: #ffffff; border: 2.5px solid #1d1b3a; display: flex; flex-direction: column; gap: 10px">
    <h2 id="course-title" style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 19px; font-weight: 600">Curso</h2>
    <div role="radiogroup" aria-labelledby="course-title" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{courses}}" as="c" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px; border-radius: 14px; border: 2.5px solid #1d1b3a; font-family: inherit; font-size: 13px; font-weight: 800; line-height: 1.2; color: #1d1b3a; cursor: pointer; text-align: left; background: {{c.bg}}; box-shadow: {{c.shadow}}">
          <span aria-hidden="true" style="width: 14px; height: 14px; flex-shrink: 0; box-sizing: border-box; border-radius: 999px; border: 2px solid #1d1b3a; background: {{c.color}}"></span>
          {{c.label}}
        </button>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 12px; font-weight: 700; color: #5b587a">Usado no ranking "Meu curso".</p>
  </section>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
      <p role="status" style="margin: 0; padding: 10px 14px; border-radius: 14px; background: #7ad88f; border: 2.5px solid #1d1b3a; font-size: 13px; font-weight: 800; text-align: center">Salvo! Vai para o servidor na próxima sincronização.</p>
    </sc-if>
    <button type="button" onClick="{{save}}" disabled="{{cannotSave}}" style="height: 58px; border-radius: 18px; border: 2.5px {{saveBorderStyle}} #1d1b3a; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 20px; font-weight: 700; cursor: pointer; background: {{saveBg}}; color: {{saveColor}}; box-shadow: {{saveShadow}}">Salvar alterações</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = {
    linked: true,
    name: 'Ana Lima',
    course: 'cc',
    savedName: 'Ana Lima',
    savedCourse: 'cc',
    saved: false,
  };

  renderVals() {
    const s = this.state;
    const defs = [
      { id: 'cc', label: 'Ciência da Computação', color: '#6aa8ff' },
      { id: 'bio', label: 'Biologia', color: '#7ad88f' },
      { id: 'enf', label: 'Enfermagem', color: '#ff8ab3' },
      { id: 'vet', label: 'Medicina Veterinária', color: '#ffc23d' },
      { id: 'agro', label: 'Agronomia', color: '#c9b8ff' },
    ];
    const trimmed = s.name.trim();
    const nameValid = trimmed.length >= 1 && trimmed.length <= 40;
    const dirty = trimmed !== s.savedName || s.course !== s.savedCourse;
    const canSave = dirty && nameValid;
    return {
      linked: s.linked,
      unlinked: !s.linked,
      link: () => this.setState({ linked: true }),
      unlink: () => this.setState({ linked: false }),
      name: s.name,
      nameCount: s.name.length,
      nameBorder: nameValid ? '#1d1b3a' : '#b42318',
      nameHint: nameValid ? 'Aparece no ranking para os outros jogadores.' : 'Digite pelo menos 1 caractere.',
      nameHintColor: nameValid ? '#5b587a' : '#b42318',
      changeName: (event) => this.setState({ name: event.target.value.slice(0, 40), saved: false }),
      courses: defs.map((c) => {
        const on = c.id === s.course;
        return {
          ...c,
          checked: on ? 'true' : 'false',
          bg: on ? '#ffc23d' : '#ffffff',
          shadow: on ? '3px 3px 0 #1d1b3a' : 'none',
          pick: () => this.setState({ course: c.id, saved: false }),
        };
      }),
      saved: s.saved,
      cannotSave: !canSave,
      saveBg: canSave ? '#ff5a4e' : '#ece9f5',
      saveColor: canSave ? '#1d1b3a' : '#5b587a',
      saveBorderStyle: canSave ? 'solid' : 'dashed',
      saveShadow: canSave ? '5px 5px 0 #1d1b3a' : 'none',
      save: () => {
        if (!canSave) return;
        this.setState({ savedName: trimmed, savedCourse: s.course, name: trimmed, saved: true });
      },
    };
  }
}
</script>
</body>
</html>
