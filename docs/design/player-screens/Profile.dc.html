<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Perfil do jogador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff6e5}
a{color:#1d1b3a}a:hover{color:#ff5a4e}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #fff6e5; font-family: 'Nunito', system-ui, sans-serif; color: #1d1b3a; display: flex; flex-direction: column; gap: 14px; padding: 22px 20px 100px; box-sizing: border-box">

  <header style="display: flex; align-items: center; gap: 14px">
    <span aria-hidden="true" style="width: 66px; height: 66px; flex-shrink: 0; box-sizing: border-box; border-radius: 22px; background: #6aa8ff; border: 2.5px solid #1d1b3a; box-shadow: 4px 4px 0 #1d1b3a; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 26px; font-weight: 700">AL</span>
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.05">Ana Lima</h1>
      <p style="margin: 3px 0 0; font-size: 14px; font-weight: 700; color: #5b587a">Ciência da Computação</p>
    </div>
    <a href="Settings.dc.html" aria-label="Configurações" style="width: 46px; height: 46px; flex-shrink: 0; box-sizing: border-box; border-radius: 14px; border: 2.5px solid #1d1b3a; background: #ffffff; box-shadow: 3px 3px 0 #1d1b3a; color: #1d1b3a; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </a>
  </header>

  <a href="Ranking.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-radius: 22px; background: #ff5a4e; border: 2.5px solid #1d1b3a; box-shadow: 5px 5px 0 #1d1b3a; text-decoration: none; color: #1d1b3a">
    <div>
      <span style="font-size: 13px; font-weight: 800">Pontuação</span>
      <div style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">1.240</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 14px; background: #ffffff; border: 2.5px solid #1d1b3a; font-weight: 800; font-size: 15px">
      4º lugar
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </div>
  </a>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="padding: 12px; border-radius: 18px; background: #ffffff; border: 2.5px solid #1d1b3a">
      <div style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 28px; font-weight: 700">10</div>
      <div style="font-size: 12px; font-weight: 800; color: #5b587a">Capturas</div>
    </div>
    <div style="padding: 12px; border-radius: 18px; background: #ffffff; border: 2.5px solid #1d1b3a">
      <div style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 28px; font-weight: 700">6/7</div>
      <div style="font-size: 12px; font-weight: 800; color: #5b587a">Espécies</div>
    </div>
    <div style="padding: 12px; border-radius: 18px; background: #ffffff; border: 2.5px solid #1d1b3a">
      <div style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 28px; font-weight: 700">14</div>
      <div style="font-size: 12px; font-weight: 800; color: #5b587a">Batalhas</div>
    </div>
  </div>

  <section aria-labelledby="items-title" style="padding: 14px 16px; border-radius: 22px; background: #ffffff; border: 2.5px solid #1d1b3a; display: flex; flex-direction: column; gap: 10px">
    <h2 id="items-title" style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 21px; font-weight: 600">Mochila</h2>
    <div style="display: flex; align-items: center; gap: 12px">
      <dc-import name="Ball" type="poke" size="40" hint-size="40px,40px"></dc-import>
      <span style="flex: 1; font-weight: 800; font-size: 15px">Pokébola</span>
      <span style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 22px; font-weight: 700">×12</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <dc-import name="Ball" type="great" size="40" hint-size="40px,40px"></dc-import>
      <span style="flex: 1; font-weight: 800; font-size: 15px">Grande bola</span>
      <span style="font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 22px; font-weight: 700">×3</span>
    </div>
  </section>

  <section aria-labelledby="sync-title" style="padding: 14px 16px; border-radius: 22px; background: #ffc23d; border: 2.5px solid #1d1b3a; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 id="sync-title" style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 21px; font-weight: 600">Sincronização</h2>
      <span style="display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: #ffffff; border: 2px solid #1d1b3a; font-size: 12px; font-weight: 800"><span style="width: 8px; height: 8px; border-radius: 999px; background: #2fb36b"></span>Online</span>
    </div>
    <p style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.45"><strong>2 ações</strong> esperando para enviar. Última vez há 3 min.</p>
    <button type="button" style="height: 46px; border-radius: 14px; border: 2.5px solid #1d1b3a; background: #ffffff; box-shadow: 3px 3px 0 #1d1b3a; font-family: inherit; font-size: 15px; font-weight: 800; color: #1d1b3a; cursor: pointer">Sincronizar agora</button>
  </section>

  <button type="button" style="height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 800; color: #b42318; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Sair da conta</button>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="Nav" active="profile" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
