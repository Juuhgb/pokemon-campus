<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Resultado da batalha</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff6e5}
a{color:#1d1b3a}a:hover{color:#ff5a4e}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #fff6e5; font-family: 'Nunito', system-ui, sans-serif; color: #1d1b3a; display: flex; flex-direction: column; padding: 24px 20px 28px; box-sizing: border-box; gap: 16px">

  <div style="position: relative; height: 250px; display: flex; align-items: center; justify-content: center">
    <div aria-hidden="true" style="position: absolute; inset: 10px 40px; border-radius: 40px; border: 2.5px solid #1d1b3a; box-shadow: 6px 6px 0 #1d1b3a; transform: rotate(-3deg); background: {{heroBg}}"></div>
    <div style="position: relative">
      <dc-import name="Creature" kind="{{heroKind}}" color="{{heroColor}}" size="136" hint-size="136px,136px"></dc-import>
    </div>
    <span style="position: absolute; top: 0; right: 36px; padding: 6px 14px; border-radius: 14px; background: #1d1b3a; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 16px; font-weight: 600; color: #ffc23d; transform: rotate(6deg)">{{badge}}</span>
  </div>

  <div style="text-align: center; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 36px; font-weight: 700; line-height: 1">{{title}}</h1>
    <p style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.45; color: #5b587a">{{subtitle}}</p>
  </div>

  <section aria-label="Recompensas" style="padding: 14px 16px; border-radius: 22px; background: #ffffff; border: 2.5px solid #1d1b3a; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{rewards}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px">
        <dc-import name="Creature" kind="{{r.kind}}" color="{{r.color}}" size="36" hint-size="36px,36px"></dc-import>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 800">
            <span>{{r.name}}</span>
            <span>{{r.gain}}</span>
          </div>
          <div style="height: 10px; border-radius: 999px; background: #ece9f5; border: 2px solid #1d1b3a; overflow: hidden; box-sizing: border-box">
            <div style="width: {{r.percent}}%; height: 100%; background: #6aa8ff"></div>
          </div>
        </div>
      </div>
    </sc-for>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="padding: 5px 12px; border-radius: 12px; border: 2.5px solid #1d1b3a; font-size: 14px; font-weight: 800; background: {{pointsBg}}">{{points}}</span>
      <span style="padding: 5px 12px; border-radius: 12px; border: 2.5px solid #1d1b3a; background: #ffffff; font-size: 14px; font-weight: 800">{{itemText}}</span>
    </div>
  </section>

  <p role="status" style="margin: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: #ffc23d; border: 2.5px solid #1d1b3a; font-size: 13px; font-weight: 800; line-height: 1.4">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
    Resultado salvo no aparelho. Será confirmado pelo servidor ao sincronizar.
  </p>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="{{primaryHref}}" style="display: flex; align-items: center; justify-content: center; height: 60px; box-sizing: border-box; border-radius: 18px; border: 2.5px solid #1d1b3a; background: #ff5a4e; box-shadow: 5px 5px 0 #1d1b3a; text-decoration: none; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 20px; font-weight: 700">{{primaryLabel}}</a>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; text-decoration: underline; text-underline-offset: 3px; font-size: 15px; font-weight: 800">Voltar ao mapa</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"outcome":{"editor":"enum","options":["captured","won","lost","fled"],"default":"captured"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const outcome = this.props.outcome ?? 'captured';
    const xpTeam = (brasinha, faiscao) => [
      { name: 'Brasinha', kind: 'flame', color: '#ff8a5c', gain: brasinha, percent: 72 },
      { name: 'Brotinho', kind: 'leaf', color: '#7ad88f', gain: faiscao, percent: 35 },
    ];
    const variants = {
      captured: {
        badge: 'Novo!', title: 'Capturado!', subtitle: 'Faiscão entrou para o seu álbum.',
        heroKind: 'bolt', heroColor: '#ffc23d', heroBg: '#7ad88f',
        rewards: xpTeam('+64 XP', '+22 XP'), points: '+120 pts', pointsBg: '#7ad88f', itemText: '1 Pokébola usada',
        primaryHref: 'Collection.dc.html', primaryLabel: 'Ver no álbum',
      },
      won: {
        badge: 'Vitória', title: 'Você venceu!', subtitle: 'Faiscão desmaiou e voltou para a natureza.',
        heroKind: 'flame', heroColor: '#ff8a5c', heroBg: '#ffc23d',
        rewards: xpTeam('+80 XP', '+26 XP'), points: '+60 pts', pointsBg: '#ffc23d', itemText: 'Nenhum item usado',
        primaryHref: 'Main.dc.html', primaryLabel: 'Continuar explorando',
      },
      lost: {
        badge: 'Fim', title: 'Sua equipe desmaiou', subtitle: 'Descanse um pouco. Seus Pokémon recuperam PV com o tempo.',
        heroKind: 'flame', heroColor: '#e6e3f0', heroBg: '#c9b8ff',
        rewards: xpTeam('+10 XP', '+4 XP'), points: '+0 pts', pointsBg: '#ece9f5', itemText: '2 Pokébolas usadas',
        primaryHref: 'Team.dc.html', primaryLabel: 'Ver equipe',
      },
      fled: {
        badge: 'Fuga', title: 'Você fugiu', subtitle: 'Faiscão continua por perto até o spawn expirar.',
        heroKind: 'bolt', heroColor: '#ffc23d', heroBg: '#bfe3ff',
        rewards: xpTeam('+0 XP', '+0 XP'), points: '+0 pts', pointsBg: '#ece9f5', itemText: 'Nenhum item usado',
        primaryHref: 'Main.dc.html', primaryLabel: 'Voltar a explorar',
      },
    };
    return variants[outcome] ?? variants.captured;
  }
}
</script>
</body>
</html>
