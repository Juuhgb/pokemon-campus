<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Coleção</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff6e5}
a{color:#1d1b3a}a:hover{color:#ff5a4e}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #fff6e5; font-family: 'Nunito', system-ui, sans-serif; color: #1d1b3a; display: flex; flex-direction: column">
  <header style="padding: 22px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 34px; font-weight: 700; line-height: 1">Meu álbum</h1>
      <span style="padding: 6px 12px; border-radius: 12px; background: #ff5a4e; border: 2.5px solid #1d1b3a; box-shadow: 3px 3px 0 #1d1b3a; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 18px; font-weight: 700">6/7</span>
    </div>
    <div style="height: 16px; border-radius: 999px; background: #ffffff; border: 2.5px solid #1d1b3a; overflow: hidden; box-sizing: border-box">
      <div style="width: 86%; height: 100%; background: #ffc23d; border-right: 2.5px solid #1d1b3a; box-sizing: border-box"></div>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 16px; background: #ffffff; border: 2.5px solid #1d1b3a; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar no álbum</span>
      <input type="search" placeholder="Buscar no álbum" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 700; color: #1d1b3a">
    </label>
    <div role="group" aria-label="Filtrar por raridade" style="display: flex; gap: 8px; overflow-x: auto; padding: 2px 4px 6px 0">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; color: #1d1b3a; border: 2.5px solid #1d1b3a; background: {{f.bg}}; box-shadow: {{f.shadow}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <section aria-label="Pokémon do álbum" style="flex: 1; min-height: 0; padding: 4px 20px 100px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-content: start">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="7">
      <article style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 18px; background: {{item.bg}}; border: 2.5px {{item.borderStyle}} #1d1b3a; box-shadow: {{item.shadow}}; text-align: center">
        <span style="align-self: stretch; display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: #5b587a">
          <span>#{{item.number}}</span>
          <span>{{item.count}}</span>
        </span>
        <dc-import name="Creature" kind="{{item.kind}}" color="{{item.color}}" size="54" hint-size="54px,54px"></dc-import>
        <h2 style="margin: 4px 0 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 16px; font-weight: 600; line-height: 1.1">{{item.name}}</h2>
        <span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; background: {{item.chipBg}}; color: {{item.chipColor}}">{{item.rarity}}</span>
      </article>
    </sc-for>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="Nav" active="collection" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { filter: 'all' };

  renderVals() {
    const rarityLabel = { common: 'Comum', uncommon: 'Incomum', rare: 'Raro', legendary: 'Lendário' };
    const rarityChip = {
      common: { bg: '#ece9f5', color: '#1d1b3a' },
      uncommon: { bg: '#7ad88f', color: '#1d1b3a' },
      rare: { bg: '#6aa8ff', color: '#1d1b3a' },
      legendary: { bg: '#1d1b3a', color: '#ffc23d' },
    };
    const filterDefs = [
      { id: 'all', label: 'Todos' },
      { id: 'common', label: 'Comum' },
      { id: 'uncommon', label: 'Incomum' },
      { id: 'rare', label: 'Raro' },
      { id: 'legendary', label: 'Lendário' },
    ];
    const species = [
      { number: '001', name: 'Brotinho', kind: 'leaf', color: '#7ad88f', rarity: 'common', caught: 3 },
      { number: '002', name: 'Gotinha', kind: 'drop', color: '#6aa8ff', rarity: 'common', caught: 2 },
      { number: '003', name: 'Pedregulho', kind: 'rock', color: '#d9c3a0', rarity: 'common', caught: 1 },
      { number: '004', name: 'Faiscão', kind: 'bolt', color: '#ffc23d', rarity: 'uncommon', caught: 2 },
      { number: '005', name: 'Corujito', kind: 'wing', color: '#c9b8ff', rarity: 'uncommon', caught: 1 },
      { number: '006', name: 'Brasinha', kind: 'flame', color: '#ff8a5c', rarity: 'rare', caught: 1 },
      { number: '007', name: 'Aurorix', kind: 'star', color: '#ffd76a', rarity: 'legendary', caught: 0 },
    ];
    const filter = this.state.filter;
    const filters = filterDefs.map((f) => {
      const on = f.id === filter;
      return {
        ...f,
        pressed: on ? 'true' : 'false',
        bg: on ? '#ffc23d' : '#ffffff',
        shadow: on ? '3px 3px 0 #1d1b3a' : 'none',
        pick: () => this.setState({ filter: f.id }),
      };
    });
    const items = species
      .filter((s) => filter === 'all' || s.rarity === filter)
      .map((s) => {
        const known = s.caught > 0;
        const chip = known ? rarityChip[s.rarity] : { bg: '#ece9f5', color: '#5b587a' };
        return {
          number: s.number,
          count: known ? '×' + s.caught : '',
          kind: known ? s.kind : 'unknown',
          color: known ? s.color : '#e6e3f0',
          name: known ? s.name : '???',
          rarity: known ? rarityLabel[s.rarity] : 'Falta achar',
          chipBg: chip.bg,
          chipColor: chip.color,
          bg: known ? '#ffffff' : '#f7f1e3',
          borderStyle: known ? 'solid' : 'dashed',
          shadow: known ? '4px 4px 0 #1d1b3a' : 'none',
        };
      });
    return { filters, items };
  }
}
</script>
</body>
</html>
